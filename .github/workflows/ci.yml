name: deterministic-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/backend-v1]

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          fastapi==0.137.2 uvicorn==0.49.0 python-multipart==0.0.32
          httpx==0.28.1
          pytest==9.1.1 numpy==2.3.5 opencv-contrib-python==4.10.0.84
          PyMuPDF==1.27.2.3 pillow==12.2.0 pydantic==2.13.4
          pydantic-settings==2.14.2 python-dotenv==1.2.2 pytesseract==0.3.13
          python-dateutil==2.9.0.post0 rapidfuzz==3.9.7 requests==2.34.2
          matplotlib==3.11.0 psutil==7.2.2 pillow-avif-plugin==1.6.0
      - name: Compile deterministic modules
        run: python -m compileall -q app
      - name: Run full deterministic and invoice regression suite
        run: python -m pytest -q
