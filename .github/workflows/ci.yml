name: deterministic-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/backend-v1]

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 numpy==2.3.5 opencv-contrib-python==4.10.0.84
          PyMuPDF==1.27.2.3 pillow==12.2.0 pydantic==2.13.4
          pydantic-settings==2.14.2 python-dotenv==1.2.2 pytesseract==0.3.13
          python-dateutil==2.9.0.post0 rapidfuzz==3.9.7
      - name: Compile deterministic modules
        run: python -m compileall -q app/document_intelligence app/cdc_analysis app/boq
      - name: Run producer, CDC, BOQ, and cross-module tests
        run: >-
          python -m pytest -q
          tests/document_intelligence
          tests/cdc_analysis
          tests/boq
          tests/integration
